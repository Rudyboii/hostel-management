<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave Requests | Smart Hostel</title>
</head>

<body style="
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:#eef3f9;
  color:#222;
">

<!-- ================= HEADER ================= -->
<div style="
  background:#0d47a1;
  color:white;
  padding:16px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
">
  <h3 style="margin:0;">Leave Requests</h3>
  <a href="javascript:history.back()" style="
    color:white;
    text-decoration:none;
    font-size:14px;
  ">
    ← Back
  </a>
</div>

<!-- ================= HERO ================= -->
<div style="
  max-width:1000px;
  margin:40px auto 20px;
  padding:0 20px;
">
  <div style="
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    color:white;
    padding:32px;
    border-radius:20px;
    box-shadow:0 18px 40px rgba(0,0,0,0.15);
  ">
    <h1 style="margin:0;">Student Leave Applications</h1>
    <p style="margin-top:10px;opacity:0.95;">
      Review and approve or reject leave requests submitted by students
    </p>
  </div>
</div>

<!-- ================= LEAVE LIST ================= -->
<div style="
  max-width:1000px;
  margin:30px auto 60px;
  padding:0 20px;
">
</div>

<!-- ================= FOOTER ================= -->
<div style="
  background:#0d47a1;
  color:white;
  text-align:center;
  padding:15px;
  font-size:14px;
">
  Smart Hostel Management System
</div>

<script type="module">
import { auth, db } from "../src/config.js";
import {
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const container = document.querySelector("div[style*='max-width:1000px'][style*='margin:30px']");

// ================= ROLE PROTECTION =================
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "../auth/login.html";
    return;
  }

  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);

  if (!snap.exists() || snap.data().role !== "admin") {
    alert("Access denied");
    window.location.href = "../dashboard/student.html";
    return;
  }

  loadLeaves();
});

// ================= REAL-TIME LEAVE LIST =================
function loadLeaves() {

  const q = query(
    collection(db, "leaves"),
    orderBy("createdAt", "desc")
  );

  onSnapshot(q, (snapshot) => {
    container.innerHTML = "";

    if (snapshot.empty) {
      container.innerHTML = "<p>No leave requests found.</p>";
      return;
    }

    snapshot.forEach(docSnap => {
      const leave = docSnap.data();
      const id = docSnap.id;

      let statusColor = "#ffecb3";
      let statusText = "Pending";

      if (leave.status === "approved") {
        statusColor = "#c8e6c9";
        statusText = "Approved";
      }

      if (leave.status === "rejected") {
        statusColor = "#ffcdd2";
        statusText = "Rejected";
      }

      const card = document.createElement("div");
      card.style = `
        background:white;
        padding:30px;
        margin-bottom:25px;
        border-radius:18px;
        box-shadow:0 12px 30px rgba(0,0,0,0.08);
      `;

      card.innerHTML = `
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:10px;
        ">
          <h3 style="margin:0;">Leave Request</h3>
          <span style="
            background:${statusColor};
            padding:6px 14px;
            border-radius:20px;
            font-size:13px;
            font-weight:600;
          ">
            ${statusText}
          </span>
        </div>

        <p><strong>Student:</strong> ${leave.studentEmail}</p>
        <p><strong>From:</strong> ${leave.fromDate}</p>
        <p><strong>To:</strong> ${leave.toDate}</p>

        <p style="margin:12px 0 20px;color:#555;">
          ${leave.reason}
        </p>

        ${
          leave.status === "pending"
          ? `
          <div>
            <button data-id="${id}" data-action="approve"
              style="
                background:#0d47a1;
                color:white;
                border:none;
                padding:10px 22px;
                border-radius:8px;
                cursor:pointer;
                margin-right:10px;
              ">
              Approve
            </button>

            <button data-id="${id}" data-action="reject"
              style="
                background:#d32f2f;
                color:white;
                border:none;
                padding:10px 22px;
                border-radius:8px;
                cursor:pointer;
              ">
              Reject
            </button>
          </div>
          `
          : ""
        }
      `;

      container.appendChild(card);
    });

    // ================= BUTTON ACTION HANDLER =================
    document.querySelectorAll("button[data-id]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");

        await updateDoc(doc(db, "leaves", id), {
          status: action === "approve" ? "approved" : "rejected"
        });
      };
    });

  });
}
</script>


</body>
</html>
