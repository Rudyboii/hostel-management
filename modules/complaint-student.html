<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complaints | Smart Hostel</title>
</head>

<body style="
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:#eef3f9;
  color:#222;
">

<!-- ================= HEADER ================= -->
<div style="
  background:#0d47a1;
  color:white;
  padding:16px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
">
  <h3 style="margin:0;">Complaints</h3>
  <a href="javascript:history.back()" style="
    color:white;
    text-decoration:none;
    font-size:14px;
  ">
    ← Back
  </a>
</div>
<div id="notification"
  style="
    display:none;
    padding:14px 20px;
    margin:20px auto;
    max-width:900px;
    border-radius:10px;
    font-size:14px;
  ">
</div>


<!-- ================= HERO ================= -->
<div style="
  max-width:900px;
  margin:40px auto 20px;
  padding:0 20px;
">
  <div style="
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    color:white;
    padding:32px;
    border-radius:20px;
    box-shadow:0 18px 40px rgba(0,0,0,0.15);
  ">
    <h1 style="margin:0;">Raise a Complaint</h1>
    <p style="margin-top:10px;opacity:0.95;">
      Report hostel issues so they can be resolved quickly
    </p>
  </div>
</div>

<!-- ================= FORM SECTION ================= -->
<div style="
  max-width:900px;
  margin:30px auto 60px;
  padding:0 20px;
">

  <div style="
    background:white;
    padding:36px;
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,0.08);
  ">

    <h2 style="margin-top:0;">Complaint Details</h2>

    <!-- COMPLAINT TYPE -->
    <label style="font-weight:600;">Complaint Type</label>
    <select  id="type" required style="
      width:100%;
      padding:12px;
      margin:10px 0 22px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:14px;
    ">
      <option value="">Select issue type</option>
      <option>Water Problem</option>
      <option>Electricity Issue</option>
      <option>Cleanliness</option>
      <option>Internet / WiFi</option>
      <option>Furniture / Room Issue</option>
      <option>Other</option>
    </select>

    <!-- LOCATION -->
    <label style="font-weight:600;">Location / Room Number</label>
    <input id="room"
      type="text"
      placeholder="e.g. Room 203"
      required
      style="
        width:100%;
        padding:12px;
        margin:10px 0 22px;
        border-radius:8px;
        border:1px solid #ccc;
        font-size:14px;
      "
    >

    <!-- DESCRIPTION -->
    <label style="font-weight:600;">Description</label>
    <textarea id="desc"
      placeholder="Describe the issue clearly"
      required
      style="
        width:100%;
        height:120px;
        padding:12px;
        margin:10px 0 30px;
        border-radius:8px;
        border:1px solid #ccc;
        font-size:14px;
        resize:none;
      "
    ></textarea>

    <!-- SUBMIT BUTTON -->
    <button 
  id="submitBtn"
  style="
    background:#0d47a1;
    color:white;
    border:none;
    padding:14px 34px;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
    transition:background 0.2s ease;
  "
  onmouseover="this.style.background='#08306b'"
  onmouseout="this.style.background='#0d47a1'"
>
  Submit Complaint
</button>


  </div>
</div>
<p style="margin-top:20px;">
  <a href="../modules/my-complaints.html"
     style="color:#0d47a1;text-decoration:none;">
    View my complaints →
  </a>
</p>

<!-- ================= FOOTER ================= -->
<div style="
  background:#0d47a1;
  color:white;
  text-align:center;
  padding:15px;
  font-size:14px;
">
  Smart Hostel Management System
</div>
<script type="module">
import { auth, db } from "../src/config.js";
import {
  collection,
  addDoc,
  Timestamp
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const btn = document.getElementById("submitBtn");

console.log("Button:", btn);

btn.addEventListener("click", async () => {
  console.log("Button clicked");

  const type = document.getElementById("type").value.trim();
  const room = document.getElementById("room").value.trim();
  const desc = document.getElementById("desc").value.trim();

  console.log(type, room, desc);

  const user = auth.currentUser;
  console.log("User:", user);

  if (!type || !room || !desc) {
    alert("All fields required");
    return;
  }

  if (!user) {
    alert("Please login first");
    return;
  }

  await addDoc(collection(db, "complaints"), {
    type,
    room,
    description: desc,
    studentEmail: user.email,
    status: "pending",
    createdAt: Timestamp.now()
  });

  alert("Complaint submitted");
});
</script>


</body>
</html>
