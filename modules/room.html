<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Room Details | Smart Hostel</title>
</head>

<body style="
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:#eef3f9;
  color:#222;
">

<!-- HEADER -->
<div style="
  background:#0d47a1;
  color:white;
  padding:16px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
">
  <h3 style="margin:0;">Room Details</h3>
  <a href="javascript:history.back()" style="
    color:white;
    text-decoration:none;
    font-size:14px;
  ">
    ← Back
  </a>
</div>

<!-- HERO -->
<div style="max-width:900px;margin:40px auto 20px;padding:0 20px;">
  <div style="
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    color:white;
    padding:32px;
    border-radius:20px;
    box-shadow:0 18px 40px rgba(0,0,0,0.15);
  ">
    <h1 style="margin:0;">Your Hostel Room</h1>
    <p style="margin-top:10px;opacity:0.95;">
      View your room and accommodation details
    </p>
  </div>
</div>

<!-- ROOM DETAILS -->
<div style="max-width:900px;margin:30px auto 60px;padding:0 20px;">

  <div style="
    background:white;
    padding:36px;
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,0.08);
  ">

    <h2 style="margin-top:0;">Accommodation Information</h2>

    <div style="
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
      margin-top:20px;
    ">

      <div>
        <strong>Hostel Name</strong>
        <p id="hostelName" style="margin:6px 0;color:#555;"></p>
      </div>

      <div>
        <strong>Room Number</strong>
        <p id="roomNumber" style="margin:6px 0;color:#555;"></p>
      </div>

      <div>
        <strong>Floor</strong>
        <p id="floor" style="margin:6px 0;color:#555;"></p>
      </div>

      <div>
        <strong>Bed Number</strong>
        <p id="bedNumber" style="margin:6px 0;color:#555;"></p>
      </div>

      <div>
        <strong>Allotted Date</strong>
        <p id="allottedDate" style="margin:6px 0;color:#555;"></p>
      </div>

    </div>

    <div style="
      margin-top:30px;
      padding:18px;
      background:#e3f2fd;
      border-left:5px solid #1976d2;
      border-radius:10px;
    ">
      <strong>Room Status:</strong>
      <span style="color:#2e7d32;font-weight:600;">
        Active & Allotted
      </span>
    </div>

  </div>

</div>

<!-- FOOTER -->
<div style="
  background:#0d47a1;
  color:white;
  text-align:center;
  padding:15px;
  font-size:14px;
">
  Smart Hostel Management System
</div>

<script type="module">

import { auth, db } from "../src/config.js";
import { doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

auth.onAuthStateChanged(async (user) => {

  if (!user) {
    window.location.href = "../auth/login.html";
    return;
  }

  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);

  if (!userSnap.exists()) {
    alert("User data missing");
    return;
  }

  const userData = userSnap.data();

  // 🚨 1️⃣ No room selected
  if (!userData.roomId) {
    window.location.href = "./allocation/select-room.html";
    return;
  }

  // 🚨 2️⃣ Room selected but no bed assigned
  if (userData.roomId && !userData.bedNo) {
    window.location.href =
      "./allocation/select-bed.html?room=" + userData.roomId;
    return;
  }

  // ✅ 3️⃣ Fully assigned → show room page

  document.getElementById("roomNumber").innerText = userData.roomId;

  document.getElementById("floor").innerText =
    "Floor " + Math.floor(userData.roomId / 100);

  document.getElementById("bedNumber").innerText =
    "Bed " + userData.bedNo;

  const date = new Date(userData.allottedAt || Date.now());
  document.getElementById("allottedDate").innerText =
    date.toDateString();

});

</script>

</body>
</html>
