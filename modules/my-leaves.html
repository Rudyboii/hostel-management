<!DOCTYPE html>
<html>
<head>
  <title>My Leave Requests</title>
</head>

<body style="margin:0;font-family:Segoe UI,Arial;background:#eef3f9;">

<!-- HEADER -->
<div style="
  background:#0d47a1;
  color:white;
  padding:16px 30px;
  display:flex;
  justify-content:space-between;
">
  <h3 style="margin:0;">My Leave Requests</h3>
  <a href="javascript:history.back()" style="color:white;text-decoration:none;">
    ← Back
  </a>
</div>

<!-- CONTENT -->
<div style="max-width:1000px;margin:40px auto;padding:0 20px;">
  <div id="leaveList">
    Loading your leave requests...
  </div>
</div>

<script type="module">
import { auth, db } from "../src/config.js";
import {
  collection,
  query,
  where,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const leaveList = document.getElementById("leaveList");

auth.onAuthStateChanged((user) => {
  if (!user) {
    window.location.href = "../auth/login.html";
    return;
  }

  const q = query(
    collection(db, "leaves"),
    where("studentEmail", "==", user.email),
    orderBy("createdAt", "desc")
  );

  onSnapshot(q, (snapshot) => {
    leaveList.innerHTML = "";

    if (snapshot.empty) {
      leaveList.innerHTML = "<p>No leave requests submitted yet.</p>";
      return;
    }

    snapshot.forEach(doc => {
      const l = doc.data();

      const card = document.createElement("div");
      card.style = `
        background:white;
        padding:25px;
        border-radius:16px;
        margin-bottom:20px;
        box-shadow:0 10px 25px rgba(0,0,0,.1);
      `;

      let statusColor = "#f9a825";
      let statusText = "Pending";

      if (l.status === "approved") {
        statusColor = "#2e7d32";
        statusText = "Approved";
      }

      if (l.status === "rejected") {
        statusColor = "#c62828";
        statusText = "Rejected";
      }

      card.innerHTML = `
        <p><b>From:</b> ${l.fromDate}</p>
        <p><b>To:</b> ${l.toDate}</p>
        <p style="color:#555;">${l.reason}</p>

        <span style="
          display:inline-block;
          margin-top:10px;
          padding:6px 14px;
          border-radius:20px;
          background:${statusColor};
          color:white;
          font-size:13px;
        ">
          ${statusText}
        </span>
      `;

      leaveList.appendChild(card);
    });
  });
});
</script>

</body>
</html>
